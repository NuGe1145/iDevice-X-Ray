name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices available | head -40

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (device, no codesign)
        run: |
          set -o pipefail
          xcodebuild \
            -project iDeviceXRay.xcodeproj \
            -scheme iDeviceXRay \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Unit tests
        run: |
          set -o pipefail
          IPHONE=$(xcrun simctl list devices available | grep -Eo 'iPhone [0-9]+[^(]*' | head -1 | sed 's/ *$//')
          echo "Simulator: $IPHONE"
          xcodebuild \
            -project iDeviceXRay.xcodeproj \
            -scheme iDeviceXRay \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$IPHONE" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            test
